[package]
name = "plane"
version = "0.2.0"
edition = "2021"
description = "Plane - schlanker Windows-PC-Cleaner"
# Die Binaries werden unten ausdrücklich aufgeführt; ohne dies fände Cargo
# src/main.rs zusätzlich automatisch und meldete einen Namenskonflikt.
autobins = false
# Es gibt zwei Binaries; ohne diese Angabe weiß `cargo run` (und damit
# `tauri dev`) nicht, welches gemeint ist.
default-run = "plane"
authors = ["Philipp Paulik"]
license = "MIT"
repository = ""

[lib]
# Eigener Name, damit Bibliothek und Binary nicht dieselbe PDB-Datei
# schreiben (Cargo-Warnung "output filename collision").
name = "plane_lib"
# Nur rlib: die cdylib-Variante braucht Tauri ausschliesslich fuer mobile
# Ziele. Plane ist eine Desktopanwendung; die zusaetzliche DLL erzeugt nur
# Buildrauschen.
crate-type = ["rlib"]

# Zwei Programme aus derselben Bibliothek: die grafische Oberfläche und die
# Kommandozeilen-/TUI-Fassung. Beide Einträge stehen ausdrücklich hier, damit
# Cargo nicht auf die automatische Erkennung angewiesen ist.
[[bin]]
name = "plane"
path = "src/main.rs"

[[bin]]
name = "plane-cli"
path = "src/bin/plane-cli.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "system"] }
glob = "0.3.4"
walkdir = "2.5.0"
clap = { version = "4.6.6", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
ctrlc = "3.5.2"
# Die einzige Netzwerkabhängigkeit – ausschließlich für die
# Aktualisierungsprüfung, die standardmäßig **aus** ist.
#   native-tls        verschlüsselt über SChannel, also über den
#                     TLS-Stack und den Zertifikatspeicher von Windows.
#                     Kein mitgeliefertes Krypto, keine eigenen Wurzeln,
#                     kein C-Compiler zum Bauen – und es funktioniert dort,
#                     wo eine Firma TLS aufbricht.
#   win-system-proxy  respektiert den im System eingetragenen Proxy.
ureq = { version = "3.4.1", default-features = false, features = ["native-tls", "win-system-proxy"] }

[dev-dependencies]
# Nur fuer die Unit-Tests: die Tauri-Commands sind async.
tokio = { version = "1", features = ["macros", "rt"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"
