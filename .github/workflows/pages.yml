name: Project website
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: project-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp frontend/assets/app-icn.png site/social.png
      - name: Social previews bereitstellen
        run: |
          mkdir -p site/assets
          printf '%s' '' | base64 --decode > site/assets/kifachblatt-og.png
          printf '%s' '' | base64 --decode > site/assets/diewarheit-og.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
